<header class="sticky top-0 z-30 w-full bg-[#F2F2F7]/85 backdrop-blur-xl transition-all">
<div class="max-w-[420px] mx-auto px-margin pt-3 pb-2 flex items-center justify-between min-h-[44px]">

<button aria-label="Back" class="w-11 h-11 -ml-2.5 flex items-center justify-center text-primary ios-press rounded-full" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<!-- 8-Dot Progress Indicator (Step 6 Active) -->
<div aria-label="Step 6 of 8" aria-valuemax="8" aria-valuemin="1" aria-valuenow="6" class="flex items-center space-x-1.5" role="progressbar">

<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>
<!-- Dot 2 -->
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>

<div class="w-5 h-1.5 rounded-full bg-primary transition-all duration-300"></div>
<!-- Dot 7 -->
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>
<!-- Dot 8 -->
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/60"></div>
</div>
<!-- Balanced spacer for exact symmetry -->
<div aria-hidden="true" class="w-11 h-11 -mr-2.5"></div>
</div>
